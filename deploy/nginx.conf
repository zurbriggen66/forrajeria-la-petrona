# Un solo server block: el SPA y la API salen del mismo origen, asi que no hay
# CORS ni contenido mixto que configurar.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/petrona
#   sudo ln -s /etc/nginx/sites-available/petrona /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Despues corre `sudo certbot --nginx -d TU_SUBDOMINIO.duckdns.org`, que
# reescribe este archivo agregando el bloque 443 y la redireccion desde 80.

server {
    listen 80;
    server_name TU_SUBDOMINIO.duckdns.org;

    # Los tickets y el respaldo JSON pueden pesar; el default de 1M es corto.
    client_max_body_size 10M;

    # Archivos del admin de Django. Los sirve nginx directo desde STATIC_ROOT
    # (por eso el proyecto no necesita whitenoise).
    location /static/ {
        alias /home/petrona/app/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sin esto Django cree que la conexion es HTTP y SECURE_SSL_REDIRECT
        # arma un loop infinito de redirecciones.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # El SPA. try_files manda todo lo que no sea un archivo real a index.html,
    # que es lo que necesita react-router para que /pos o /clientes anden al
    # recargar la pagina.
    location / {
        root /home/petrona/app/frontend/dist;
        try_files $uri /index.html;
    }
}
